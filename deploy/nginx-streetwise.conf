# Copy to /etc/nginx/sites-available/streetwise, replace YOUR_DOMAIN,
# then link it into sites-enabled (see docs/deploy-aws.md).
#
# This file only listens on port 80. Run `sudo certbot --nginx -d YOUR_DOMAIN`
# afterwards and certbot adds the HTTPS part and the redirect for you.
#
# One site serves everything, so the browser sees ONE origin:
#   /api/   and  /admin/   -> Django (gunicorn)
#   /static/               -> Django admin styles (collectstatic output)
#   everything else        -> the React build, with index.html as the fallback
#                             so links like /events/manage work on refresh.

upstream streetwise_app {
    server unix:/run/streetwise/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Event forms are tiny. Anything bigger is not a form.
    client_max_body_size 1m;

    root /var/www/streetwise;
    index index.html;

    location /api/ {
        proxy_pass http://streetwise_app;
        include /etc/nginx/streetwise-proxy.conf;
    }

    location /admin/ {
        proxy_pass http://streetwise_app;
        include /etc/nginx/streetwise-proxy.conf;
    }

    location /static/ {
        alias /opt/streetwise/app/staticfiles/;
        expires 7d;
    }

    # Vite puts a hash in these file names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri /index.html;
        # Always re-check index.html so a new deploy shows up right away.
        add_header Cache-Control "no-cache";
    }
}
