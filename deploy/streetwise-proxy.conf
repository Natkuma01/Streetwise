# Copy to /etc/nginx/streetwise-proxy.conf. Shared by the /api/ and /admin/ blocks.
proxy_set_header Host $host;
# $remote_addr REPLACES whatever the visitor sent. With NUM_PROXIES=1 in .env,
# Django reads this as the visitor's address, and the rate limits cannot be
# dodged by sending a fake X-Forwarded-For header.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
proxy_read_timeout 30s;
